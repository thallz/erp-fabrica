<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressão A4 de Produção — ERP Fabrica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #111827;
      --brand: #4f46e5;
      --text: #1f2937;
      --text-muted: #4b5563;
      --border: #d1d5db;
      --border-light: #e5e7eb;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: #f3f4f6;
      padding: 24px;
      line-height: 1.45;
    }

    .print-actions {
      max-width: 820px;
      margin: 0 auto 18px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: white;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .btn {
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-print { background: var(--brand); color: white; }
    .btn-print:hover { background: #4338ca; }
    .btn-close { background: #f3f4f6; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-close:hover { background: #e5e7eb; }

    .ficha-page {
      max-width: 820px;
      margin: 0 auto 20px auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 36px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    .ficha-header {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
    }
    .factory-logo { font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .6px; }
    .ficha-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      background: #eef2ff; padding: 4px 10px; border-radius: 4px; color: #3730a3;
      margin-top: 5px; display: inline-block;
    }
    .header-details {
      display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 6px 14px; font-size: 12.5px;
    }
    .op-block {
      margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; page-break-inside: avoid;
    }
    .op-title-row {
      background: #f3f4f6; border-bottom: 1px solid var(--border);
      padding: 9px 14px; font-weight: 700; font-size: 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .op-inner { padding: 10px 14px; }
    .batelada-pill {
      display: inline-block; background: #fef3c7; color: #92400e;
      border: 1px solid #fcd34d; border-radius: 6px; padding: 4px 10px;
      font-size: 12px; font-weight: 700; margin-bottom: 8px;
    }
    .ingredient-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ingredient-table th {
      background: #f9fafb; border: 1px solid var(--border); text-align: left;
      padding: 6px 8px; font-size: 10.5px; text-transform: uppercase; font-weight: 700; color: var(--text-muted);
    }
    .ingredient-table td { border: 1px solid var(--border-light); padding: 6px 8px; }
    .check-box-mock { width: 14px; height: 14px; border: 1.5px solid #6b7280; border-radius: 3px; margin: 0 auto; }
    .obs-box { margin-top: 18px; page-break-inside: avoid; }
    .obs-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: #374151; margin-bottom: 6px; }
    .obs-line { border-bottom: 1px solid #9ca3af; height: 22px; width: 100%; }
    .signatures-row { display: flex; justify-content: space-between; gap: 24px; margin-top: 28px; page-break-inside: avoid; }
    .signature-line { flex: 1; border-top: 1px solid var(--text-muted); text-align: center; font-size: 11px; color: var(--text-muted); padding-top: 5px; }
    .loading { text-align: center; font-size: 15px; color: var(--text-muted); padding: 50px 0; }

    @media print {
      @page { size: A4; margin: 12mm; }
      body { background: white; padding: 0; }
      .print-actions { display: none !important; }
      .ficha-page {
        border: none; box-shadow: none; padding: 0; max-width: 100%; margin: 0;
        page-break-after: always; break-after: page;
      }
      .ficha-page:last-child { page-break-after: auto; break-after: auto; }
    }
  </style>
</head>
<body>

  <div class="print-actions">
    <div>
      <strong id="print-bar-title">Impressão A4 de Produção</strong>
      <p style="font-size:12px; color:var(--text-muted);">Formato A4 pronto para impressão.</p>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="planejamento.html" class="btn btn-close">← Voltar ao Planejamento</a>
      <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </div>

  <div id="fichas-wrapper">
    <div class="ficha-page"><div class="loading">Carregando dados para impressão...</div></div>
  </div>

  <script>
    const API = 'http://localhost:3001/api';

    function formatarData(dataStr) {
      if (!dataStr) return '—';
      const limpo = String(dataStr).split('T')[0];
      const parts = limpo.split('-');
      if (parts.length !== 3) return limpo;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function renderPreparo(data, filtroTipo) {
      const isMassas = filtroTipo === 'massas';
      const isRecheios = filtroTipo === 'recheios';
      const lista = isMassas ? (data.massas || []) : isRecheios ? (data.recheios || []) : (data.preparos || []);
      const titulo = isMassas ? 'FICHA DE MASSAS (COZINHA)' : isRecheios ? 'FICHA DE RECHEIOS & MOLHOS (COZINHA)' : 'FICHA DE MASSAS E RECHEIOS (COZINHA)';
      document.getElementById('print-bar-title').textContent = titulo;

      const blocos = lista.length === 0
        ? `<div style="text-align:center;padding:30px;color:#6b7280;border:1px dashed #d1d5db;border-radius:8px">Nenhum preparo encontrado para o período selecionado.</div>`
        : lista.map(prep => `
          <div class="op-block">
            <div class="op-title-row">
              <span>🥣 ${prep.nome} <small style="font-weight:500;color:#4b5563">(${prep.categoria})</small></span>
              <span>Peso Total: <strong>${prep.peso_total_kg} kg</strong></span>
            </div>
            <div class="op-inner">
              <div class="batelada-pill">🔥 Panelas (10 kg): ${prep.instrucao_batelada}</div>
              <table class="ingredient-table">
                <thead>
                  <tr><th>Ingrediente</th><th width="180">Quantidade</th><th width="70" style="text-align:center">Pesado</th></tr>
                </thead>
                <tbody>
                  ${(prep.ingredientes || []).map(ing => `
                    <tr>
                      <td><strong>${ing.nome}</strong></td>
                      <td><strong>${ing.exibicao}</strong></td>
                      <td style="text-align:center"><div class="check-box-mock"></div></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `).join('');

      document.getElementById('fichas-wrapper').innerHTML = `
        <div class="ficha-page">
          <div class="ficha-header">
            <div>
              <div class="factory-logo">ERP FÁBRICA — COZINHA</div>
              <div class="ficha-title">${titulo}</div>
            </div>
            <div class="header-details">
              <div>Período: <strong>${formatarData(data.data_inicio)} a ${formatarData(data.data_fim)}</strong></div>
              <div>Padrão Panela: <strong>10 kg</strong></div>
            </div>
          </div>
          ${blocos}
          <div class="obs-box">
            <div class="obs-title">Observações da Cozinha</div>
            <div class="obs-line"></div>
            <div class="obs-line"></div>
          </div>
          <div class="signatures-row">
            <div class="signature-line">Responsável Cozinha / Pesagem</div>
            <div class="signature-line">Supervisor de Produção</div>
          </div>
        </div>
      `;
    }

    function renderColaboradores(data, isSemana) {
      const fichas = data.fichas || [];
      if (!fichas.length) {
        document.getElementById('fichas-wrapper').innerHTML = `<div class="ficha-page"><div class="loading">Nenhuma produção alocada no período selecionado.</div></div>`;
        return;
      }

      document.getElementById('fichas-wrapper').innerHTML = fichas.map(ficha => {
        const colab = ficha.colaborador;
        const diasHtml = (ficha.dias || []).map(dia => {
          if (!dia.itens || !dia.itens.length) {
            return isSemana ? `<div class="op-block"><div class="op-title-row"><span>📅 ${dia.dia_nome} (${formatarData(dia.data)})</span><span style="color:#6b7280;font-size:12px">Sem itens alocados</span></div></div>` : '';
          }
          return `
            <div class="op-block">
              <div class="op-title-row">
                <span>📅 ${dia.dia_nome} (${formatarData(dia.data)})</span>
                <span>Total: <strong>${dia.total_unidades} / ${dia.meta_diaria_individual} un</strong></span>
              </div>
              <div class="op-inner">
                <table class="ingredient-table">
                  <thead>
                    <tr><th>Salgado / Produto</th><th width="110" style="text-align:center">Quantidade (un)</th><th width="110">Realizado</th><th width="100">Perdas</th></tr>
                  </thead>
                  <tbody>
                    ${dia.itens.map(it => `
                      <tr>
                        <td><strong>${it.produto_nome}</strong></td>
                        <td style="text-align:center"><strong>${it.quantidade_total} un</strong></td>
                        <td>________ un</td>
                        <td>______ un</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="ficha-page">
            <div class="ficha-header">
              <div>
                <div class="factory-logo">ERP FÁBRICA — PRODUÇÃO</div>
                <div class="ficha-title">${isSemana ? 'FICHA SEMANAL DO COLABORADOR (SEG–SEX)' : 'FICHA DIÁRIA DO COLABORADOR'}</div>
              </div>
              <div class="header-details">
                <div>Colaborador: <strong>${colab.nome}</strong></div>
                <div>Período: <strong>${formatarData(data.data_inicio)} a ${formatarData(data.data_fim)}</strong></div>
                <div>Meta Diária: <strong>${colab.meta_diaria_individual} un</strong></div>
                <div>Total Alocado: <strong>${ficha.total_unidades} un</strong></div>
              </div>
            </div>
            ${diasHtml || '<div style="text-align:center;padding:24px;color:#6b7280">Nenhum salgado alocado neste período.</div>'}
            <div class="obs-box">
              <div class="obs-title">Observações</div>
              <div class="obs-line"></div>
              <div class="obs-line"></div>
              <div class="obs-line"></div>
            </div>
            <div class="signatures-row">
              <div class="signature-line">Assinatura — ${colab.nome}</div>
              <div class="signature-line">Assinatura — Supervisor</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function carregarFicha() {
      const urlParams  = new URLSearchParams(window.location.search);
      const modo       = (urlParams.get('modo') || 'diaria').toLowerCase();
      const colabId    = urlParams.get('colaborador_id') || 'TODOS';
      const dataStr    = urlParams.get('data');
      const dataInicio = urlParams.get('data_inicio');
      const dataFim    = urlParams.get('data_fim');
      const datas      = urlParams.get('datas');

      try {
        if (modo === 'preparo' || modo === 'massas' || modo === 'recheios') {
          const qs = new URLSearchParams();
          if (datas) qs.set('datas', datas);
          else if (dataInicio && dataFim) { qs.set('data_inicio', dataInicio); qs.set('data_fim', dataFim); }
          else if (dataStr) { qs.set('data', dataStr); }
          const res = await fetch(`${API}/planejamento/mapa-preparo?${qs.toString()}`);
          if (!res.ok) throw new Error('Falha ao carregar dados da cozinha.');
          const data = await res.json();
          renderPreparo(data, modo);
          return;
        }

        const qs = new URLSearchParams();
        qs.set('colaborador_id', colabId);
        const isSemana = modo === 'semana';
        if (datas) qs.set('datas', datas);
        else if (dataInicio && dataFim) { qs.set('data_inicio', dataInicio); qs.set('data_fim', dataFim); }
        else if (dataStr) { qs.set('datas', dataStr); }

        const res = await fetch(`${API}/planejamento/fichas-colaboradores?${qs.toString()}`);
        if (!res.ok) throw new Error('Falha ao carregar fichas de colaboradores.');
        const data = await res.json();
        renderColaboradores(data, isSemana);
      } catch (err) {
        document.getElementById('fichas-wrapper').innerHTML = `<div class="ficha-page"><div class="loading" style="color:red">Erro: ${err.message}</div></div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', carregarFicha);
  </script>
</body>
</html>
