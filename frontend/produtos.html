<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos Finais — ERP Fabrica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .toolbar .search-bar { flex: 1; max-width: 380px; }
    .toolbar-right { margin-left: auto; }

    .prod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .prod-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .prod-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .prod-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .prod-meta {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .badge-prod {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-price { background: #f0fdf4; color: #166534; }
    .badge-points { background: #faf5ff; color: #6b21a8; }

    .action-icons { display: flex; gap: 6px; }
    .action-icons button {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.12s;
    }
    .action-icons button:hover { border-color: var(--brand); color: var(--brand); }
    .action-icons button.red:hover { border-color: var(--red); color: var(--red); }

    .ficha-resumo {
      font-size: 12px;
      color: var(--text-secondary);
      border-top: 1px dashed var(--border-light);
      padding-top: 10px;
      margin-top: 12px;
    }
    .ficha-title {
      font-weight: 700;
      margin-bottom: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Form items inside drawer */
    .row-ficha-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .ficha-row {
      display: grid;
      grid-template-columns: 80px 180px 1fr 24px;
      gap: 6px;
      align-items: center;
    }
    .ficha-row select, .ficha-row input {
      padding: 6px;
      font-size: 12px;
    }
    .btn-add-ficha {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand);
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-add-ficha:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="erp-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>ERP Fabrica</span>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Menu Principal</div>
      <a href="almoxarifado.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        📦 Almoxarifado
      </a>
      <a href="receitas.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        👨🍳 Receitas
      </a>
      <a href="produtos.html" class="nav-link active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        🍰 Produtos Finais
      </a>
      <a href="clientes.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        👥 Clientes
      </a>
      <a href="vendas.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        💰 Lançar Vendas
      </a>
      <a href="planejamento.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        📅 Planejamento de Produção (Maestro)
      </a>
    </nav>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrap">
    <header class="topbar">
      <h2>🍰 Produtos Finais (Cadastrados para Venda)</h2>
      <div class="topbar-right">
        <span class="badge-offline" id="connection-status">Online</span>
      </div>
    </header>

    <div class="content-body">
      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" id="input-busca" class="search-bar" placeholder="Buscar produto..." oninput="filtrar()" />
        <div class="toolbar-right">
          <button class="btn btn-brand" onclick="abrirDrawer()">+ Novo Produto</button>
        </div>
      </div>

      <!-- Grid de Produtos -->
      <div class="prod-grid" id="product-list">
        <!-- Carregado via JS -->
      </div>
    </div>
  </div>

  <!-- Drawer lateral para Cadastro / Edição -->
  <div class="slide-over" id="drawer-form" style="width: 480px">
    <div class="slide-over-header">
      <h3 id="drawer-titulo">Novo Produto</h3>
      <button class="slide-over-close" onclick="fecharDrawer()">&times;</button>
    </div>
    <div class="slide-over-body">
      <form id="form-produto" onsubmit="salvarProduto(event)">
        <input type="hidden" id="produto-id" />

        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="produto-nome" required placeholder="Ex: Coxinha de Frango com Catupiry" />
        </div>

        <div class="form-row cols-2">
          <div class="form-group">
            <label>Preço de Venda (R$)</label>
            <input type="number" id="produto-preco" step="0.01" min="0" required placeholder="Ex: 8.50" />
          </div>
          <div class="form-group">
            <label>Peso de Produtividade (Pontos)</label>
            <input type="number" id="produto-peso-prod" step="0.1" min="0.1" required value="1.0" placeholder="Ex: 1.0" />
          </div>
        </div>

        <div class="form-group">
          <label>Categoria de Produção</label>
          <select id="produto-categoria" required>
            <option value="Frito">Frito</option>
            <option value="Assado">Assado</option>
            <option value="Mini">Mini</option>
          </select>
        </div>

        <!-- Ficha Técnica Mista -->
        <div style="margin-top:16px">
          <label style="font-weight:600">Composição (Ficha Técnica)</label>
          <div class="row-ficha-container" id="ficha-container">
            <!-- Linhas inseridas dinamicamente -->
          </div>
          <button type="button" class="btn-add-ficha" onclick="adicionarLinhaFicha()">+ Adicionar Componente</button>
        </div>

        <div style="margin-top: 28px; display:flex; gap:10px">
          <button type="submit" class="btn btn-brand" style="flex:1">Salvar Produto</button>
          <button type="button" class="btn btn-outline" onclick="fecharDrawer()" style="flex:1">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

</div>

<script>
  const API_PRODUTOS = 'http://localhost:3001/api/produtos';
  const API_RECEITAS = 'http://localhost:3001/api/receitas';
  const API_INSUMOS = 'http://localhost:3001/api/insumos';

  let todosProdutos = [];
  let todasReceitas = [];
  let todosInsumos = [];

  async function carregarDados() {
    try {
      const [resProd, resRec, resIns] = await Promise.all([
        fetch(API_PRODUTOS),
        fetch(API_RECEITAS),
        fetch(API_INSUMOS)
      ]);
      todosProdutos = await resProd.json();
      todasReceitas = await resRec.json();
      todosInsumos = await resIns.json();

      // Carregar os detalhes das fichas técnicas de cada produto
      for (let i = 0; i < todosProdutos.length; i++) {
        const detRes = await fetch(`${API_PRODUTOS}/${todosProdutos[i].id}`);
        todosProdutos[i] = await detRes.json();
      }

      renderizar(todosProdutos);
    } catch (e) {
      console.error(e);
      document.getElementById('product-list').innerHTML = `<p style="color:var(--red);grid-column:1/-1;text-align:center">Erro ao carregar dados do servidor.</p>`;
    }
  }

  function renderizar(lista) {
    const grid = document.getElementById('product-list');
    if (lista.length === 0) {
      grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px">Nenhum produto cadastrado.</p>`;
      return;
    }

    grid.innerHTML = lista.map(p => `
      <div class="prod-card">
        <div class="prod-card-header">
          <div>
            <span class="badge badge-brand" style="font-size:10px;margin-bottom:4px;display:inline-block">${p.categoria_producao || 'Geral'}</span>
            <div class="prod-card-title">${p.nome}</div>
            <div class="prod-meta">
              <span class="badge-prod badge-price">R$ ${parseFloat(p.preco_venda).toFixed(2)}</span>
              <span class="badge-prod badge-points">Produtividade: ${parseFloat(p.peso_produtividade).toFixed(1)} pt</span>
            </div>
          </div>
          <div class="action-icons">
            <button onclick="editarProduto(${p.id})" title="Editar"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="red" onclick="excluirProduto(${p.id})" title="Excluir"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
        </div>
        
        <div class="ficha-resumo">
          <div class="ficha-title">Composição:</div>
          ${(p.ficha_tecnica_receitas && p.ficha_tecnica_receitas.length > 0) || (p.ficha_tecnica_insumos && p.ficha_tecnica_insumos.length > 0) ? `
            ${(p.ficha_tecnica_receitas || []).map(r => `
              <div style="display:flex;justify-content:space-between;padding:2px 0">
                <span>• ${r.nome} <span style="font-size:9px;color:var(--text-muted)">(Receita)</span></span>
                <strong>${parseFloat(r.quantidade_necessaria).toFixed(3)} kg</strong>
              </div>
            `).join('')}
            ${(p.ficha_tecnica_insumos || []).map(i => `
              <div style="display:flex;justify-content:space-between;padding:2px 0">
                <span>• ${i.nome} <span style="font-size:9px;color:var(--text-muted)">(Insumo)</span></span>
                <strong>${parseFloat(i.quantidade).toFixed(3)} ${i.unidade_medida}</strong>
              </div>
            `).join('')}
          ` : '<span style="color:var(--text-muted)">Sem componentes.</span>'}
        </div>
      </div>
    `).join('');
  }

  function filtrar() {
    const query = document.getElementById('input-busca').value.toLowerCase();
    const filtrados = todosProdutos.filter(p => p.nome.toLowerCase().includes(query));
    renderizar(filtrados);
  }

  function abrirDrawer(id = null) {
    const drawer = document.getElementById('drawer-form');
    drawer.classList.add('open');
    document.getElementById('ficha-container').innerHTML = '';

    if (id) {
      document.getElementById('drawer-titulo').innerText = 'Editar Produto';
      const item = todosProdutos.find(p => p.id === id);
      document.getElementById('produto-id').value = item.id;
      document.getElementById('produto-nome').value = item.nome;
      document.getElementById('produto-preco').value = item.preco_venda;
      document.getElementById('produto-peso-prod').value = item.peso_produtividade;
      document.getElementById('produto-categoria').value = item.categoria_producao || 'Frito';

      if (item.ficha_tecnica_receitas && item.ficha_tecnica_receitas.length > 0) {
        item.ficha_tecnica_receitas.forEach(r => adicionarLinhaFicha({ tipo: 'receita', id: r.receita_id, qtd: r.quantidade_necessaria }));
      }
      if (item.ficha_tecnica_insumos && item.ficha_tecnica_insumos.length > 0) {
        item.ficha_tecnica_insumos.forEach(ins => adicionarLinhaFicha({ tipo: 'insumo', id: ins.insumo_id, qtd: ins.quantidade }));
      }
    } else {
      document.getElementById('drawer-titulo').innerText = 'Novo Produto';
      document.getElementById('form-produto').reset();
      document.getElementById('produto-id').value = '';
      adicionarLinhaFicha();
    }
  }

  function fecharDrawer() {
    document.getElementById('drawer-form').classList.remove('open');
  }

  function adicionarLinhaFicha(dados = null) {
    const container = document.getElementById('ficha-container');
    const rowId = 'row-' + Date.now() + '-' + Math.floor(Math.random() * 100);

    const div = document.createElement('div');
    div.className = 'ficha-row';
    div.id = rowId;

    div.innerHTML = `
      <select class="tipo-select" onchange="alternarTipoItem('${rowId}')">
        <option value="receita" ${dados && dados.tipo === 'receita' ? 'selected' : ''}>Receita</option>
        <option value="insumo" ${dados && dados.tipo === 'insumo' ? 'selected' : ''}>Insumo</option>
      </select>
      <select class="origem-select" required>
        <option value="">Selecione...</option>
      </select>
      <input type="number" class="qtd-input" step="0.0001" value="${dados ? dados.qtd : ''}" placeholder="Qtd" required />
      <button type="button" class="btn-icon text-red" onclick="removerLinhaFicha('${rowId}')" style="background:none;border:none;cursor:pointer;font-size:16px">&times;</button>
    `;

    container.appendChild(div);
    popularOrigens(rowId, dados ? dados.id : null);
  }

  function alternarTipoItem(rowId) {
    popularOrigens(rowId, null);
  }

  function popularOrigens(rowId, selectedId = null) {
    const row = document.getElementById(rowId);
    const tipo = row.querySelector('.tipo-select').value;
    const select = row.querySelector('.origem-select');
    select.innerHTML = '<option value="">Selecione...</option>';

    if (tipo === 'receita') {
      todasReceitas.forEach(r => {
        select.innerHTML += `<option value="${r.id}" ${selectedId == r.id ? 'selected' : ''}>${r.nome} (${r.categoria})</option>`;
      });
    } else {
      todosInsumos.forEach(i => {
        select.innerHTML += `<option value="${i.id}" ${selectedId == i.id ? 'selected' : ''}>${i.nome} (${i.unidade_medida})</option>`;
      });
    }
  }

  function removerLinhaFicha(rowId) {
    const el = document.getElementById(rowId);
    if (el) el.remove();
  }

  async function salvarProduto(e) {
    e.preventDefault();
    const id = document.getElementById('produto-id').value;

    const rows = document.querySelectorAll('.ficha-row');
    const fReceitas = [];
    const fInsumos = [];

    rows.forEach(row => {
      const tipo = row.querySelector('.tipo-select').value;
      const val = parseInt(row.querySelector('.origem-select').value, 10);
      const qtd = parseFloat(row.querySelector('.qtd-input').value);

      if (tipo === 'receita') {
        fReceitas.push({ receita_id: val, quantidade_necessaria: qtd });
      } else {
        fInsumos.push({ insumo_id: val, quantidade: qtd });
      }
    });

    const body = {
      nome: document.getElementById('produto-nome').value,
      preco_venda: parseFloat(document.getElementById('produto-preco').value),
      peso_produtividade: parseFloat(document.getElementById('produto-peso-prod').value),
      categoria_producao: document.getElementById('produto-categoria').value,
      ficha_tecnica_receitas: fReceitas,
      ficha_tecnica_insumos: fInsumos,
      ficha_tecnica_embalagens: []
    };

    try {
      let res;
      if (id) {
        res = await fetch(`${API_PRODUTOS}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } else {
        res = await fetch(API_PRODUTOS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      }

      if (res.ok) {
        fecharDrawer();
        carregarDados();
      } else {
        const data = await res.json();
        alert('Erro ao salvar produto: ' + data.erro);
      }
    } catch (err) {
      console.error(err);
      alert('Erro de conexão ao salvar.');
    }
  }

  async function excluirProduto(id) {
    if (!confirm('Deseja realmente excluir este produto?')) return;
    try {
      const res = await fetch(`${API_PRODUTOS}/${id}`, { method: 'DELETE' });
      if (res.ok) {
        carregarDados();
      } else {
        const data = await res.json();
        alert('Erro ao excluir: ' + data.erro);
      }
    } catch (err) {
      console.error(err);
    }
  }

  window.onload = carregarDados;
</script>
</body>
</html>
