<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receitas — ERP Fabrica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .toolbar .search-bar { flex: 1; max-width: 380px; }
    .toolbar-right { margin-left: auto; }

    .recipe-meta-badges { display: flex; gap: 6px; margin-top: 6px; }
    .badge-recipe-info { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
    .badge-weight { background: #eff6ff; color: #1e40af; }
    .badge-cost { background: #f0fdf4; color: #166534; }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .recipe-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .recipe-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .recipe-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .recipe-card-actions {
      display: flex;
      gap: 6px;
    }
    .recipe-card-actions button {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.1s;
    }
    .recipe-card-actions button:hover { border-color: var(--brand); color: var(--brand); }
    .recipe-card-actions button.red:hover { border-color: var(--red); color: var(--red); }

    .ingredient-list {
      font-size: 12px;
      color: var(--text-secondary);
      border-top: 1px dashed var(--border-light);
      padding-top: 10px;
      margin-top: auto;
    }
    .ingredient-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
    }

    /* Item rows in drawer form */
    .row-itens-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .item-row {
      display: grid;
      grid-template-columns: 80px 140px 80px 1fr 28px;
      gap: 6px;
      align-items: center;
    }
    .item-row select, .item-row input {
      padding: 6px 8px;
      font-size: 12.5px;
    }
    .row-calc-cost {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: right;
      font-weight: 600;
    }
    .btn-add-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand);
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-add-row:hover { text-decoration: underline; }

    .totals-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 16px;
      font-size: 12.5px;
    }
    .totals-line {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
  </style>
</head>
<body>
<div class="erp-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>ERP Fabrica</span>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Menu Principal</div>
      <a href="almoxarifado.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        📦 Almoxarifado
      </a>
      <a href="receitas.html" class="nav-link active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        👨🍳 Receitas
      </a>
      <a href="produtos.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        🍰 Produtos Finais
      </a>
      <a href="clientes.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        👥 Clientes
      </a>
      <a href="vendas.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        💰 Lançar Vendas
      </a>
      <a href="planejamento.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        📅 Planejamento de Produção (Maestro)
      </a>
    </nav>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrap">
    <header class="topbar">
      <h2>👨🍳 Receitas (Massas, Recheios e Pré-Preparos)</h2>
      <div class="topbar-right">
        <span class="badge-offline" id="connection-status">Online</span>
      </div>
    </header>

    <div class="content-body">
      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" id="input-busca" class="search-bar" placeholder="Buscar receita..." oninput="filtrar()" />
        <div class="toolbar-right">
          <button class="btn btn-brand" onclick="abrirDrawer()">+ Nova Receita</button>
        </div>
      </div>

      <!-- Grid de Receitas -->
      <div class="recipe-grid" id="recipe-list">
        <!-- Carregado via JS -->
      </div>
    </div>
  </div>

  <!-- Drawer lateral para Cadastro / Edição -->
  <div class="slide-over" id="drawer-form" style="width: 480px">
    <div class="slide-over-header">
      <h3 id="drawer-titulo">Nova Receita</h3>
      <button class="slide-over-close" onclick="fecharDrawer()">&times;</button>
    </div>
    <div class="slide-over-body">
      <form id="form-receita" onsubmit="salvarReceita(event)">
        <input type="hidden" id="receita-id" />

        <div class="form-group">
          <label>Nome da Receita</label>
          <input type="text" id="receita-nome" required placeholder="Ex: Massa Especial de Coxinha" />
        </div>

        <div class="form-group">
          <label>Categoria</label>
          <select id="receita-categoria" required>
            <option value="Massa">Massa</option>
            <option value="Recheio">Recheio</option>
            <option value="Tempero">Tempero</option>
            <option value="Molho">Molho</option>
          </select>
        </div>

        <!-- Lista de Ingredientes / Sub-receitas -->
        <div style="margin-top:16px">
          <label style="font-weight:600">Ingredientes da Receita</label>
          <div class="row-itens-container" id="items-container">
            <!-- Linhas inseridas dinamicamente -->
          </div>
          <button type="button" class="btn-add-row" onclick="adicionarLinhaItem()">+ Adicionar Item</button>
        </div>

        <!-- Box de Totais -->
        <div class="totals-box">
          <div class="totals-line">
            <span>Peso Total:</span>
            <strong id="total-peso">0 g (0.00 kg)</strong>
          </div>
          <div class="totals-line">
            <span>Custo Total Estimado:</span>
            <strong id="total-custo">R$ 0,00</strong>
          </div>
          <div class="totals-line" style="border-top:1px solid var(--border-light);padding-top:6px;margin-top:6px">
            <span>Custo por kg:</span>
            <strong style="color:var(--brand)" id="total-custo-kg">R$ 0,00 / kg</strong>
          </div>
        </div>

        <div style="margin-top: 24px; display:flex; gap:10px">
          <button type="submit" class="btn btn-brand" style="flex:1">Salvar Receita</button>
          <button type="button" class="btn btn-outline" onclick="fecharDrawer()" style="flex:1">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

</div>

<script>
  const API_RECEITAS = 'http://localhost:3001/api/receitas';
  const API_INSUMOS = 'http://localhost:3001/api/insumos';

  let todasReceitas = [];
  let todosInsumos = [];

  async function carregarDados() {
    try {
      const [resRec, resIns] = await Promise.all([
        fetch(API_RECEITAS),
        fetch(API_INSUMOS)
      ]);
      todasReceitas = await resRec.json();
      todosInsumos = await resIns.json();
      renderizar(todasReceitas);
    } catch (e) {
      console.error(e);
      document.getElementById('recipe-list').innerHTML = `<p style="color:var(--red);grid-column:1/-1;text-align:center">Erro ao carregar dados do servidor.</p>`;
    }
  }

  function renderizar(lista) {
    const grid = document.getElementById('recipe-list');
    if (lista.length === 0) {
      grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px">Nenhuma receita cadastrada.</p>`;
      return;
    }

    grid.innerHTML = lista.map(r => `
      <div class="recipe-card">
        <div class="recipe-card-header">
          <div>
            <span class="badge badge-brand" style="font-size:10px;margin-bottom:4px;display:inline-block">${r.categoria}</span>
            <div class="recipe-card-title">${r.nome}</div>
            <div class="recipe-meta-badges">
              <span class="badge-recipe-info badge-weight">${r.pesoTotal ? (r.pesoTotal / 1000).toFixed(2) : 0} kg</span>
              <span class="badge-recipe-info badge-cost">R$ ${r.custoPorKg ? r.custoPorKg.toFixed(2) : 0}/kg</span>
            </div>
          </div>
          <div class="recipe-card-actions">
            <button onclick="editarReceita(${r.id})" title="Editar"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="red" onclick="excluirReceita(${r.id})" title="Excluir"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
        </div>
        
        <div class="ingredient-list">
          ${r.itens && r.itens.length > 0 ? r.itens.map(it => `
            <div class="ingredient-item">
              <span>• ${it.nome} <span style="font-size:9.5px;color:var(--text-muted)">(${it.tipoOrigem === 'receita' ? 'Sub-receita' : 'Insumo'})</span></span>
              <strong>${it.g} g</strong>
            </div>
          `).join('') : '<span style="color:var(--text-muted)">Sem ingredientes vinculados.</span>'}
        </div>
      </div>
    `).join('');
  }

  function filtrar() {
    const query = document.getElementById('input-busca').value.toLowerCase();
    const filtrados = todasReceitas.filter(r => r.nome.toLowerCase().includes(query));
    renderizar(filtrados);
  }

  function abrirDrawer(id = null) {
    const drawer = document.getElementById('drawer-form');
    drawer.classList.add('open');
    document.getElementById('items-container').innerHTML = '';

    if (id) {
      document.getElementById('drawer-titulo').innerText = 'Editar Receita';
      const item = todasReceitas.find(r => r.id === id);
      document.getElementById('receita-id').value = item.id;
      document.getElementById('receita-nome').value = item.nome;
      document.getElementById('receita-categoria').value = item.categoria;

      if (item.itens && item.itens.length > 0) {
        item.itens.forEach(it => adicionarLinhaItem(it));
      } else {
        adicionarLinhaItem();
      }
    } else {
      document.getElementById('drawer-titulo').innerText = 'Nova Receita';
      document.getElementById('form-receita').reset();
      document.getElementById('receita-id').value = '';
      adicionarLinhaItem();
    }
    calcularTotais();
  }

  function fecharDrawer() {
    document.getElementById('drawer-form').classList.remove('open');
  }

  function adicionarLinhaItem(dados = null) {
    const container = document.getElementById('items-container');
    const rowId = 'row-' + Date.now() + '-' + Math.floor(Math.random() * 100);

    const div = document.createElement('div');
    div.className = 'item-row';
    div.id = rowId;

    div.innerHTML = `
      <select class="tipo-select" onchange="alternarTipoItem('${rowId}')">
        <option value="materia" ${dados && dados.tipoOrigem === 'materia' ? 'selected' : ''}>Insumo</option>
        <option value="receita" ${dados && dados.tipoOrigem === 'receita' ? 'selected' : ''}>Receita</option>
      </select>
      <select class="origem-select" onchange="calcularTotais()" required>
        <option value="">Selecione...</option>
      </select>
      <input type="number" class="qtd-input" step="0.1" value="${dados ? dados.g : ''}" placeholder="g" required oninput="calcularTotais()" />
      <span class="row-calc-cost" id="${rowId}-cost">R$ 0,00</span>
      <button type="button" class="btn-icon text-red" onclick="removerLinhaItem('${rowId}')" style="background:none;border:none;cursor:pointer;font-size:16px">&times;</button>
    `;

    container.appendChild(div);
    popularOrigens(rowId, dados ? dados.idOrigem : null);
  }

  function alternarTipoItem(rowId) {
    popularOrigens(rowId, null);
    calcularTotais();
  }

  function popularOrigens(rowId, selectedId = null) {
    const row = document.getElementById(rowId);
    const tipo = row.querySelector('.tipo-select').value;
    const select = row.querySelector('.origem-select');
    select.innerHTML = '<option value="">Selecione...</option>';

    const currentId = parseInt(document.getElementById('receita-id').value || 0);

    if (tipo === 'materia') {
      todosInsumos.forEach(i => {
        select.innerHTML += `<option value="${i.id}" data-cost="${i.custo_unitario}" ${selectedId == i.id ? 'selected' : ''}>${i.nome}</option>`;
      });
    } else {
      todasReceitas.forEach(r => {
        if (r.id !== currentId) {
          select.innerHTML += `<option value="${r.id}" data-cost="${r.custoPorKg / 1000}" ${selectedId == r.id ? 'selected' : ''}>${r.nome}</option>`;
        }
      });
    }
  }

  function removerLinhaItem(rowId) {
    const el = document.getElementById(rowId);
    if (el) el.remove();
    calcularTotais();
  }

  function calcularTotais() {
    let pesoTotal = 0;
    let custoTotal = 0;

    const rows = document.querySelectorAll('.item-row');
    rows.forEach(row => {
      const select = row.querySelector('.origem-select');
      const optionSelected = select.options[select.selectedIndex];
      const costPerGram = optionSelected ? parseFloat(optionSelected.getAttribute('data-cost') || 0) : 0;
      const g = parseFloat(row.querySelector('.qtd-input').value || 0);
      
      const custoItem = g * costPerGram;
      pesoTotal += g;
      custoTotal += custoItem;

      row.querySelector('.row-calc-cost').innerText = 'R$ ' + custoItem.toFixed(2);
    });

    const custoPorKg = pesoTotal > 0 ? (custoTotal / pesoTotal) * 1000 : 0;

    document.getElementById('total-peso').innerText = `${pesoTotal.toFixed(1)} g (${(pesoTotal/1000).toFixed(2)} kg)`;
    document.getElementById('total-custo').innerText = `R$ ${custoTotal.toFixed(2)}`;
    document.getElementById('total-custo-kg').innerText = `R$ ${custoPorKg.toFixed(2)} / kg`;
  }

  async function salvarReceita(e) {
    e.preventDefault();
    const id = document.getElementById('receita-id').value;
    
    // Obter itens
    const rows = document.querySelectorAll('.item-row');
    const itens = Array.from(rows).map(row => {
      const select = row.querySelector('.origem-select');
      const opt = select.options[select.selectedIndex];
      return {
        tipoOrigem: row.querySelector('.tipo-select').value,
        idOrigem: parseInt(select.value, 10),
        nome: opt ? opt.text : '',
        g: parseFloat(row.querySelector('.qtd-input').value),
        custoUnitario: opt ? parseFloat(opt.getAttribute('data-cost') || 0) : 0,
        custo: parseFloat(row.querySelector('.qtd-input').value) * (opt ? parseFloat(opt.getAttribute('data-cost') || 0) : 0)
      };
    });

    if (itens.length === 0) {
      alert('A receita deve possuir pelo menos um ingrediente.');
      return;
    }

    const body = {
      nome: document.getElementById('receita-nome').value,
      categoria: document.getElementById('receita-categoria').value,
      itens
    };

    try {
      let res;
      if (id) {
        res = await fetch(`${API_RECEITAS}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } else {
        res = await fetch(API_RECEITAS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      }

      if (res.ok) {
        fecharDrawer();
        carregarDados();
      } else {
        const data = await res.json();
        alert('Erro ao salvar receita: ' + data.erro);
      }
    } catch (err) {
      console.error(err);
      alert('Erro de conexão ao salvar.');
    }
  }

  async function excluirReceita(id) {
    if (!confirm('Deseja realmente excluir esta receita?')) return;
    try {
      const res = await fetch(`${API_RECEITAS}/${id}`, { method: 'DELETE' });
      if (res.ok) {
        carregarDados();
      } else {
        const data = await res.json();
        alert('Erro ao excluir: ' + data.erro);
      }
    } catch (err) {
      console.error(err);
    }
  }

  window.onload = carregarDados;
</script>
</body>
</html>
